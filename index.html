<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Surprise ❤️</title>
    <style>
        body {
            background-color: #ffdae0;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        .heart {
            position: absolute;
            top: -10px;
            color: #ff4d6d;
            font-size: 20px;
            animation: fall linear forwards;
            z-index: -1;
        }
        @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }

        .container {
            background: white;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 85%;
            max-width: 380px;
            border: 4px solid #ff4d6d;
            position: relative;
        }

        .couple-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 15px;
            margin: 15px 0;
            border: 2px solid #ff4d6d;
        }

        .buttons {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            height: 150px; /* مساحة للأزرار المفرقة */
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            position: absolute;
            transition: 0.1s;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }

        #noBtn {
            background-color: #888;
            color: white;
            bottom: 20px;
            right: 20px;
        }
    </style>
</head>
<body>

    <div class="container" id="mainCard">
        <h1 style="color: #d63384; font-size: 22px;">Will you be my Valentine? ❤️</h1>
        
        <img src="https://i.ibb.co/HTM8ZLKK/IMG-3406.jpg" class="couple-img" id="photo">

        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">Yes!</button>
            <button id="noBtn" onmouseover="moveNo()">No</button>
        </div>
    </div>

    <script>
        let yesSize = 18;

        function moveNo() {
            const no = document.getElementById('noBtn');
            const yes = document.getElementById('yesBtn');
            
            // الفخ: الزر "No" كيهرب في الشاشة كلها
            const x = Math.random() * (window.innerWidth - no.offsetWidth);
            const y = Math.random() * (window.innerHeight - no.offsetHeight);
            no.style.left = x + 'px';
            no.style.top = y + 'px';

            // زر Yes كيكبر كل ما حاولت تبرك على No
            yesSize += 10;
            yes.style.fontSize = yesSize + 'px';
            yes.style.padding = (yesSize/2) + 'px ' + (yesSize) + 'px';
        }

        function celebrate() {
            document.getElementById('mainCard').innerHTML = `
                <h1 style="font-size: 30px; color: #d63384;">Yaaay! I knew it! ❤️🎉</h1>
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2Zic3R4bmh6eHB6Z3R6eHB6Z3R6eHB6Z3R6eHB6Z3R6eHB6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/K976VvI9I2j9m/giphy.gif" width="100%" style="border-radius:15px;">
                <h2 style="color: #ff4d6d;">I Love You Forever! 🌹</h2>
            `;
            setInterval(createHeart, 200);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }
    </script>
</body>
</html>
